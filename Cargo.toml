[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/baxyz/folioscope"
homepage = "https://folioscope.baxyz.dev"
authors = ["baxyz <berenger@arnaud.work>"]

[workspace.dependencies]
folioscope-core = { path = "crates/folioscope-core", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
