[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/baxyz/folioscope"
homepage = "https://folioscope.baxyz.dev"
authors = ["baxyz <berenger@arnaud.work>"]

[workspace.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
folioscope = { path = "crates/folioscope", version = "1.0.0" }
folioscope-wasm = { path = "crates/folioscope-wasm", version = "0.0.0" }
helpers4 = { version = "0.0.11", default-features = false }
image-webp = "0.2"
insta = "1.49"
# Text layout for the formats that store no glyph outlines (docs/spec/bake.md): pure Rust, no system font.
parley = { version = "0.13", default-features = false, features = ["std"] }
# Pure Rust, no assembly or threads, so it also builds for WebAssembly.
ravif = { version = "0.13", default-features = false }
# `/regex/flags` font rules: small, pure Rust, builds for WebAssembly.
regex-lite = "0.1"
# Glyphs come as outlines in the files, so resvg needs no text shaping or system fonts.
resvg = { version = "0.50", default-features = false, features = ["raster-images"] }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
skrifa = "0.50"
thiserror = "2"
thumbhash = "0.1"
wuff = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Dependencies are optimized in debug builds too: the image encoders (AVIF above all) run
# hundreds of times slower unoptimized, which made every bake in tests and CI crawl. Our own
# crates stay quick to compile.
[profile.dev.package."*"]
opt-level = 3
