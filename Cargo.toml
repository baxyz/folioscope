[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/baxyz/folioscope"
homepage = "https://folioscope.baxyz.dev"
authors = ["baxyz <berenger@arnaud.work>"]

[workspace.dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
folioscope-core = { path = "crates/folioscope-core", version = "0.0.0" }
helpers4 = { version = "0.0.7", default-features = false }
insta = "1.49"
ruzstd = "0.9"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
