packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@sketch-hq/sketch-file-format-ts": 6.5.0
  "@types/node": ^24
  fflate: 0.8.3
  openfig-core: 0.4.1
  playwright: 1.64.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
