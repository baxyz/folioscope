packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@sketch-hq/sketch-file-format-ts": 6.5.0
  "@types/node": ^26
  axe-core: 4.14.1
  fflate: 0.8.3
  helpers4: 3.1.12
  openfig-core: 0.4.1
  playwright: 1.65.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true
  workerd: true
