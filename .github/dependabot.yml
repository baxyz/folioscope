# One pull request a week for everything: the crates, the npm packages and the actions together
# (a multi-ecosystem group), instead of one per ecosystem. The workflows pin their actions to a
# commit: this is how the pins move. A security advisory still gets a pull request of its own,
# as soon as it is known.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
