name: Release

# Pushing a tag vX.Y.Z publishes the folioscope npm package at version X.Y.Z, then creates the
# GitHub release. npm trusted publishing: npm authenticates this workflow through OIDC, so no
# token is stored, and the package gets a provenance attestation.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install --frozen-lockfile

      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./packages/folioscope/package.json").version')
          test "v$version" = "$TAG" || { echo "tag $TAG, package $version"; exit 1; }

      - run: pnpm --filter folioscope build:wasm
      - run: pnpm --filter folioscope build
      - run: pnpm --filter folioscope test

      # pnpm pack turns catalog: versions into real ones; npm publishes the tarball, as only npm
      # speaks trusted publishing. Outside the repository, so its devEngines (pnpm) don't apply.
      - name: Publish
        run: |
          pnpm --filter folioscope pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm install --global npm@11
          npm publish folioscope-*.tgz --provenance --access public

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --generate-notes --verify-tag
