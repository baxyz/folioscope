name: Release

# Run from the Actions tab. The checks of ci.yml run first, then helpers4/action-release computes
# the version from the last v* tag and the commits, updates CHANGELOG.md, builds and dry-runs the
# folioscope npm package, pushes the signed release commit to main (helpers4-bot, the bypass actor of
# the ruleset), tags it, publishes with trusted publishing (OIDC) and publishes the GitHub Release.
#
# npm validates this file name and the `npm` environment: change neither without updating the
# trusted publisher of the folioscope package on npmjs.com.
#
# Actions are pinned to a commit, here and in ci.yml: this workflow can publish, and a tag can be
# moved. Dependabot proposes their updates (.github/dependabot.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Type de release
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        description: Build and dry-run everything, write nothing
        type: boolean
        default: false

permissions: {}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    concurrency: { group: "release-${{ github.repository }}", cancel-in-progress: false }
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with: { tool: "wasm-bindgen@0.2.129" }
      - uses: helpers4/action-release@c6c22ee68ccdc124c7f036bf95617d13062b1294 # v0
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
          targets: |
            - npm: packages/folioscope
              build: pnpm --filter folioscope build:wasm && pnpm --filter folioscope build
            - jsr: packages/folioscope
            - crates: .
