name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release runs these checks before it tags

permissions:
  contents: read

jobs:
  js:
    name: JS (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm exec vp run -r build
      - name: Lite player budget (15 KB of JS, gzipped)
        run: |
          size=$(gzip -9 -c packages/folioscope/dist/index.mjs | wc -c)
          echo "lite player: $size bytes gzipped"
          test "$size" -le 15360

  rust:
    name: Rust (fmt, clippy, nextest, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=pass
      - run: cargo deny check

  e2e:
    name: E2E, budget and Vite plugin (Firefox, Chromium, WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo build -p folioscope-cli
      - run: pnpm --filter folioscope build:wasm
      - name: Full player budget (2.5 MB of WebAssembly, gzipped)
        run: |
          size=$(gzip -9 -c packages/folioscope/wasm/folioscope_wasm_bg.wasm | wc -c)
          echo "full player WebAssembly: $size bytes gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 2621440
      - run: pnpm exec vp run -r build
      - name: Vite plugin tests (need the WebAssembly bake)
        run: pnpm --filter folioscope test
      - run: pnpm --filter folioscope exec playwright install --with-deps firefox chromium
      - run: pnpm --filter folioscope test:e2e
      - name: First frame in under a second on 4G
        run: pnpm --filter folioscope test:budget
      - name: Site demos are up to date with the fixtures and the bake
        run: |
          pnpm --filter @folioscope/site bake-demos
          git diff --exit-code -- apps/site/public/folio

  # The single status to mark as required in branch protection, so adding or renaming jobs
  # never needs a settings change.
  required:
    name: Required checks passed
    if: always()
    needs: [js, rust, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
