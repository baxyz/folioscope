name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release runs these checks before it tags

permissions:
  contents: read

jobs:
  js:
    name: JS (check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test
      - run: pnpm exec vp run -r build
      # The JSR package is the player's sources: a release publishes them, and a rejected one cannot
      # be fixed afterwards (a published version is never replaced).
      - name: JSR package publishes (dry run)
        working-directory: packages/folioscope
        run: pnpm dlx jsr@0.14.3 publish --dry-run --allow-dirty
      - name: Lite player budget (15 KB of JS, gzipped)
        run: |
          # index.mjs and the chunks it shares with the full player and the Vite plugin.
          size=$(cat packages/folioscope/dist/*.mjs | gzip -9 -c | wc -c)
          echo "lite player: $size bytes gzipped"
          test "$size" -le 15360

  rust:
    name: Rust (fmt, clippy, nextest, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-nextest,cargo-deny
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Without the renderer: the crate that only reads files (docs/development.md).
      - run: cargo clippy -p folioscope --no-default-features --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-tests=pass
      - run: cargo deny check

  e2e:
    name: E2E, budget and Vite plugin (Firefox, Chromium, WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo build -p folioscope
      - run: pnpm --filter folioscope build:wasm
      - name: Full player budget (2.5 MB of WebAssembly, gzipped)
        run: |
          size=$(gzip -9 -c packages/folioscope/wasm/folioscope_wasm_bg.wasm | wc -c)
          echo "full player WebAssembly: $size bytes gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 2621440
      - run: pnpm exec vp run -r build
      - name: The npm package carries its licence and those of what it bundles
        working-directory: packages/folioscope
        run: |
          npm pack --dry-run --json > pack.json
          for file in LICENSE THIRD-PARTY-LICENSES.md dist/index.mjs wasm/folioscope_wasm_bg.wasm; do
            node -e 'const [{ files }] = JSON.parse(require("fs").readFileSync("pack.json", "utf8")); process.exit(files.some((f) => f.path === process.argv[1]) ? 0 : 1)' "$file" \
              || { echo "missing from the npm package: $file"; exit 1; }
          done
          rm pack.json
      - name: Vite plugin tests (need the WebAssembly bake)
        run: pnpm --filter folioscope test
      - run: pnpm --filter folioscope exec playwright install --with-deps firefox chromium
      - run: pnpm --filter folioscope test:e2e
      - name: First frame in under a second on 4G
        run: pnpm --filter folioscope test:budget
      - name: Comparison page, on the built site
        run: pnpm --filter @folioscope/site test:e2e
      - name: Site demos are up to date with the fixtures and the bake
        run: |
          pnpm --filter @folioscope/site bake-demos
          # The AVIF encoder picks its SIMD paths by processor: its files differ between machines.
          git diff --exit-code -- apps/site/public/folio ':!*.avif'

  # The single status to mark as required in branch protection, so adding or renaming jobs
  # never needs a settings change.
  required:
    name: Required checks passed
    if: always()
    needs: [js, rust, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
