# cargo-deny: licenses and advisories. Only AGPL-compatible licenses are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # paste is unmaintained, not vulnerable: a compile-time macro of rav1e (AVIF), with no successor
  # in rav1e 0.8 yet.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro of rav1e, no known flaw" },
]

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# rav1e (AVIF) lists libfuzzer-sys under cfg(fuzzing) only: it is never built into folioscope.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
